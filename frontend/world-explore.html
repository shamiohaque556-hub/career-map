<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerMAP — Explore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#f6f4ef;--paper:#fffdf9;--text:#1a1822;--muted:#6a6678;--faint:#9a96a8;
      --accent:#d4a93f;--accent-soft:rgba(212,169,63,.1);--border:#e7e3da;
      --red:#b54747;--red-bg:#fdf3f3;--green:#1f9d6b;--green-soft:rgba(31,157,107,.08);
      --cross:#3a6ea5;--cross-soft:rgba(58,110,165,.1);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:130px;}
    .nav{padding:20px 38px;display:flex;justify-content:space-between;align-items:center;background:var(--paper);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;}
    .brand{font-family:'Fraunces',serif;font-size:20px;font-weight:900;}
    .brand span{color:var(--accent);}
    .nav-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;}
    .hidden{display:none!important;}

    .status{text-align:center;padding:120px 24px;color:var(--muted);}
    .status .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 18px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .errbox{max-width:600px;margin:0 auto;text-align:left;background:var(--red-bg);border:1px solid #f0cfcf;border-radius:12px;padding:22px;color:#7a2020;line-height:1.6;font-size:14px;}
    .errbox a{color:var(--accent);font-weight:700;}
    .errbox code{background:#fff;padding:2px 6px;border-radius:5px;border:1px solid #f0cfcf;}

    /* ===== EDITORIAL MASTHEAD ===== */
    .masthead{position:relative;overflow:hidden;background:var(--accent);color:#fff;}
    .masthead::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% -20%,rgba(255,255,255,.25),transparent 55%);} 
    .masthead-inner{position:relative;max-width:760px;margin:0 auto;padding:64px 28px 58px;}
    .mh-back{display:inline-flex;align-items:center;gap:7px;color:rgba(255,255,255,.85);text-decoration:none;font-size:13px;font-weight:600;margin-bottom:30px;transition:.15s;}
    .mh-back:hover{color:#fff;}
    .mh-glyph{font-size:54px;line-height:1;margin-bottom:18px;filter:drop-shadow(0 4px 16px rgba(0,0,0,.25));}
    .mh-kicker{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;opacity:.85;margin-bottom:14px;}
    .mh-title{font-family:'Fraunces',serif;font-size:clamp(34px,6vw,56px);font-weight:900;line-height:1.04;letter-spacing:-.02em;margin-bottom:20px;}
    .mh-intro{font-size:16.5px;line-height:1.7;max-width:600px;opacity:.95;}

    .reading{max-width:760px;margin:0 auto;padding:0 28px;}

    /* one-thing / wont-give editorial pull quotes */
    .pull{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:40px 0 8px;}
    @media(max-width:620px){.pull{grid-template-columns:1fr;}}
    .pull-card{background:var(--paper);border:1px solid var(--border);border-radius:16px;padding:22px 24px;}
    .pull-card.keep{border-left:3px solid var(--green);}
    .pull-card.warn{border-left:3px solid var(--red);}
    .pull-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:9px;}
    .pull-card.keep .pull-label{color:var(--green);}
    .pull-card.warn .pull-label{color:var(--red);}
    .pull-text{font-size:14.5px;line-height:1.65;color:var(--text);}

    /* family sections — now boxed clickable cards */
    .fam{margin-bottom:16px;}
    .fam-header{padding:24px 26px;cursor:pointer;display:flex;align-items:flex-start;gap:16px;
      border:1.5px solid var(--border);border-radius:16px;background:var(--paper);
      transition:border-color .16s, box-shadow .16s, background .16s;}
    .fam-header:hover{border-color:var(--accent);box-shadow:0 6px 22px rgba(0,0,0,.07);}
    .fam.open .fam-header{border-color:var(--accent);background:var(--accent-soft);
      border-bottom-left-radius:0;border-bottom-right-radius:0;box-shadow:none;}
    .fam-header-text{flex:1;}
    .fam-num{font-family:'Fraunces',serif;font-size:13px;font-weight:600;color:var(--accent);margin-bottom:7px;letter-spacing:.05em;}
    .fam-name{font-family:'Fraunces',serif;font-size:23px;font-weight:600;line-height:1.18;margin-bottom:9px;}
    .fam-blurb{font-size:14px;line-height:1.65;color:var(--muted);max-width:620px;}
    .fam-chevron{font-size:20px;color:var(--accent);margin-top:6px;transition:transform .2s;flex-shrink:0;
      width:34px;height:34px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;}
    .fam.open .fam-chevron{transform:rotate(90deg);background:rgba(212,169,63,.25);}
    .fam-count{display:inline-block;font-size:12px;font-weight:600;color:var(--faint);background:var(--paper);border:1px solid var(--border);border-radius:20px;padding:3px 11px;margin-left:10px;vertical-align:middle;}
    .fam-picked-badge{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-left:8px;}
    /* expanded body sits attached under the card, boxed to match */
    .fam-body{padding:26px;border:1.5px solid var(--accent);border-top:none;
      border-bottom-left-radius:16px;border-bottom-right-radius:16px;background:var(--paper);}

    /* whole-family pick banner */
    .whole-fam{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1.5px dashed var(--accent);border-radius:14px;background:var(--accent-soft);cursor:pointer;margin-bottom:18px;transition:.16s;}
    .whole-fam:hover{background:rgba(212,169,63,.16);}
    .whole-fam.picked{border-style:solid;background:rgba(212,169,63,.2);}
    .wf-check{width:24px;height:24px;border:2px solid var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0;transition:.15s;}
    .whole-fam.picked .wf-check{background:var(--accent);}
    .wf-body{flex:1;}
    .wf-title{font-size:15px;font-weight:700;margin-bottom:2px;}
    .wf-sub{font-size:12.5px;color:var(--muted);line-height:1.45;}
    .fam-or{text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);margin-bottom:16px;}

    /* role = editorial entry */
    .role{position:relative;padding:22px 22px 22px 60px;border-radius:14px;cursor:pointer;transition:background .16s;margin-bottom:6px;}
    .role:hover{background:var(--paper);}
    .role.picked{background:var(--accent-soft);}
    .role-check{position:absolute;left:20px;top:23px;width:24px;height:24px;border:2px solid var(--faint);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;transition:.15s;}
    .role.picked .role-check{background:var(--accent);border-color:var(--accent);}
    .role-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:7px;}
    .role-name{font-size:18px;font-weight:700;letter-spacing:-.01em;}
    .role-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:5px;background:var(--accent-soft);color:#9c7a1e;}
    .role-cross{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:5px;background:var(--cross-soft);color:var(--cross);}
    .role-desc{font-size:14.5px;line-height:1.68;color:#3a3746;margin-bottom:10px;}
    .role-real{font-size:13px;line-height:1.6;color:#8a3030;background:var(--red-bg);border:1px solid #f2d8d8;border-radius:9px;padding:11px 14px;margin-bottom:8px;}
    .role-real b{font-weight:700;}
    /* access marker */
    .role-access{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:5px;}
    .acc-green{background:rgba(31,157,107,.12);color:var(--green);}
    .acc-yellow{background:rgba(212,169,63,.14);color:#9c7a1e;}
    .acc-red{background:var(--red-bg);color:var(--red);}
    /* extra role detail lines */
    .role-extra{font-size:13px;line-height:1.6;color:#4a4757;margin-top:7px;}
    .role-extra b{color:#2a2736;font-weight:700;}

    /* decision screen */
    .decision{max-width:640px;margin:0 auto;padding:80px 28px;text-align:center;}
    .dec-badge{display:inline-flex;align-items:center;gap:8px;background:var(--green-soft);color:var(--green);border:1px solid rgba(31,157,107,.3);border-radius:30px;padding:9px 20px;font-weight:700;font-size:14px;margin-bottom:24px;}
    .dec-q{font-family:'Fraunces',serif;font-size:33px;font-weight:900;line-height:1.12;margin-bottom:16px;letter-spacing:-.01em;}
    .dec-sub{font-size:15px;color:var(--muted);line-height:1.65;margin-bottom:24px;}
    .dec-picks{background:var(--paper);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:14px;padding:20px 24px;margin-bottom:34px;text-align:left;}
    .dec-picks .dp-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:12px;}
    .dec-picks .dp-role{font-weight:600;font-size:14.5px;padding:7px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;}
    .dec-picks .dp-role:last-child{border-bottom:none;}
    .dec-picks .dp-role::before{content:"✓";color:var(--green);font-weight:800;}
    .dec-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

    .action-bar{position:fixed;bottom:0;left:0;width:100%;background:var(--paper);border-top:1px solid var(--border);padding:16px 38px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 -10px 34px rgba(0,0,0,.06);z-index:30;}
    .action-info{font-weight:700;font-size:15px;}
    .action-hint{font-size:12.5px;color:var(--muted);margin-top:2px;}
    .btn{padding:13px 26px;border-radius:30px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;border:none;transition:.2s;text-decoration:none;display:inline-block;}
    .btn-ghost{background:none;border:1px solid var(--border);color:var(--text);}
    .btn-ghost:hover{border-color:var(--text);}
    .btn-primary{background:var(--accent);color:#1a1305;}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 26px rgba(212,169,63,.3);}
    .btn-primary:disabled{background:var(--border);color:var(--faint);cursor:not-allowed;}
  </style>
</head>
<body>
  <div class="nav">
    <div class="brand">Career<span>MAP</span></div>
    <div style="display:flex;align-items:center;gap:14px;"><a href="profile.html" style="text-decoration:none;color:#d4a93f;font-size:13px;font-weight:600;border:1px solid rgba(212,169,63,.4);padding:7px 14px;border-radius:20px;white-space:nowrap;">↩ Dashboard</a><div class="nav-label" id="nav-label">Exploring</div></div>
  </div>

  <div id="status" class="status">
    <div class="spinner"></div>
    <p style="font-family:'Fraunces',serif;font-size:18px;">Opening this world…</p>
  </div>

  <!-- EXPLORE -->
  <div id="explore" class="hidden">
    <div class="masthead" id="masthead">
      <div class="masthead-inner">
        <a class="mh-back" href="world.html">← All worlds</a>
        <div class="mh-glyph" id="mh-glyph">🧭</div>
        <div class="mh-kicker">The World Of</div>
        <h1 class="mh-title" id="mh-title"></h1>
        <p class="mh-intro" id="mh-intro"></p>
      </div>
    </div>

    <div class="reading">
      <div class="pull" id="pull-row">
        <div class="pull-card keep">
          <div class="pull-label">If you take one thing</div>
          <div class="pull-text" id="one-thing"></div>
        </div>
        <div class="pull-card warn">
          <div class="pull-label">What it won't give you</div>
          <div class="pull-text" id="wont-give"></div>
        </div>
      </div>

      <div id="families"></div>
    </div>
  </div>

  <!-- DECISION -->
  <div id="decision" class="hidden">
    <div class="decision">
      <div class="dec-badge" id="dec-badge">✓ Explored</div>
      <h1 class="dec-q">Add another world, or continue with this?</h1>
      <p class="dec-sub" id="dec-sub"></p>
      <div class="dec-picks" id="dec-picks"></div>
      <div class="dec-btns">
        <button class="btn btn-ghost" onclick="addAnother()">+ Explore another world</button>
        <button class="btn btn-primary" onclick="continueOn()">Continue with what I have →</button>
      </div>
    </div>
  </div>

  <!-- action bar -->
  <div class="action-bar hidden" id="action-bar">
    <div>
      <div class="action-info" id="action-info">0 paths selected here</div>
      <div class="action-hint" id="action-hint">Tick the paths that pull at you.</div>
    </div>
    <button class="btn btn-primary" id="done-btn" disabled onclick="finishWorld()">Done with this world →</button>
  </div>

  <script src="config.js"></script>
  <script src="userstore.js"></script>
  <script>
    const CONTENT_URL="industries.json";
    const ACCENTS={
      tech:"#5b8def", manufacturing:"#e2843b", engineering:"#7c6cf0", trades:"#c98a3a",
      finance:"#3fae7a", entrepreneurship:"#e0653f", healthcare:"#e0607d", academics:"#5aa0d6",
      creative:"#d265c2", government:"#6d7fc4", agriculture:"#8aab3e", sustainability:"#4cb588",
      retail:"#e09a3c", hospitality:"#d6735a", athletics:"#4aa3c4", business:"#b98ad6"
    };

    let DATA=null, world=null, currentKey=null, picks={};
    let openFamilies={};  // tracks which family indexes are expanded

    async function init(){
      currentKey=userStore.get("explore_current");
      picks=JSON.parse(userStore.get("explore_selections_raw")||"{}");
      try{
        const res=await fetch(CONTENT_URL);
        if(!res.ok) throw new Error("HTTP "+res.status);
        DATA=await res.json();
      }catch(err){ showError(err.message); return; }

      world=(DATA.industries||[]).find(i=>i.key===currentKey&&i.enabled!==false)
          ||(DATA.industries||[]).find(i=>i.enabled!==false);
      if(!world){ showError("No industries available."); return; }
      currentKey=world.key;
      if(!picks[currentKey]) picks[currentKey]={};

      // apply this world's accent
      const accent=ACCENTS[world.key]||"#d4a93f";
      document.documentElement.style.setProperty("--accent",accent);

      document.getElementById("status").classList.add("hidden");
      document.getElementById("explore").classList.remove("hidden");
      document.getElementById("action-bar").classList.remove("hidden");
      renderWorld();
    }

    function showError(msg){
      document.getElementById("status").innerHTML=`<div class="errbox">
        <strong>Couldn't load this world.</strong><br><br>
        Make sure <code>industries.json</code> is in the same folder and you opened this via Live Server.
        If you arrived here directly, <a href="world.html">start from world selection →</a><br><br>
        <span style="opacity:.7;">(${msg})</span></div>`;
    }

    function renderWorld(){
      document.getElementById("nav-label").textContent=`Exploring ${world.short||world.name}`;
      document.getElementById("mh-glyph").textContent=world.icon||"🧭";
      document.getElementById("mh-title").textContent=world.name;
      document.getElementById("mh-intro").textContent=world.intro||"";

      // pull quotes (hide if absent)
      const pr=document.getElementById("pull-row");
      if(world.one_thing||world.wont_give){
        document.getElementById("one-thing").textContent=world.one_thing||"—";
        document.getElementById("wont-give").textContent=world.wont_give||"—";
        pr.classList.remove("hidden");
      } else { pr.classList.add("hidden"); }

      const fc=document.getElementById("families"); fc.innerHTML="";
      let fnum=0;
      world.families.forEach((fam, famIndex)=>{
        const roles=fam.roles.filter(r=>r.enabled!==false);
        if(roles.length===0) return;
        fnum++;
        const isOpen = !!openFamilies[famIndex];

        const sec=document.createElement("div");
        sec.className="fam"+(isOpen?" open":"");

        // count how many picks are in this family (for a badge)
        const allId=`${fam.name}::__ALL__`;
        let pickedInFam=0;
        Object.keys(picks[currentKey]||{}).forEach(id=>{ if(id.startsWith(fam.name+"::")) pickedInFam++; });
        const pickedBadge = pickedInFam>0 ? `<span class="fam-picked-badge">● ${pickedInFam} selected</span>` : "";

        // clickable header (always visible)
        const header=document.createElement("div");
        header.className="fam-header";
        header.innerHTML=`
          <div class="fam-header-text">
            <div class="fam-num">${String(fnum).padStart(2,"0")} — Area</div>
            <div class="fam-name">${fam.name}<span class="fam-count">${roles.length} path${roles.length===1?"":"s"}</span>${pickedBadge}</div>
            ${fam.blurb?`<div class="fam-blurb">${fam.blurb}</div>`:""}
          </div>
          <div class="fam-chevron">▸</div>`;
        header.onclick=()=>{ const y=window.scrollY; openFamilies[famIndex]=!openFamilies[famIndex]; renderWorld(); window.scrollTo({top:y}); };
        sec.appendChild(header);

        // body (roles) — only built when open
        if(isOpen){
          const body=document.createElement("div");
          body.className="fam-body";

          // whole-family pick option
          const allPicked=!!picks[currentKey][allId];
          const whole=document.createElement("div");
          whole.className=`whole-fam${allPicked?" picked":""}`;
          whole.innerHTML=`<div class="wf-check">${allPicked?"✓":""}</div>
            <div class="wf-body">
              <div class="wf-title">Take this whole area</div>
              <div class="wf-sub">Learn the shared foundations of ${fam.name} first, then specialize. Best if you're drawn to the area but not sure which exact role yet.</div>
            </div>`;
          whole.onclick=(e)=>{ e.stopPropagation(); toggleRole(allId); };
          body.appendChild(whole);
          body.insertAdjacentHTML("beforeend",`<div class="fam-or">— or pick specific paths —</div>`);

          roles.forEach(r=>{
            const id=`${fam.name}::${r.name}`;
            const picked=!!picks[currentKey][id];
            const role=document.createElement("div");
            role.className=`role${picked?" picked":""}`;
            const cross=r.cross_link?`<span class="role-cross">→ ${r.cross_link}</span>`:"";
            // access marker
            let accHtml="";
            if(r.access==="green") accHtml=`<span class="role-access acc-green">🟢 Learnable here</span>`;
            else if(r.access==="yellow") accHtml=`<span class="role-access acc-yellow">🟡 Course / credential</span>`;
            else if(r.access==="red") accHtml=`<span class="role-access acc-red">🔴 Degree / licence</span>`;
            role.innerHTML=`<div class="role-check">${picked?"✓":""}</div>
              <div class="role-top">
                <span class="role-name">${r.name}</span>
                ${r.tag?`<span class="role-tag">${r.tag}</span>`:""}${accHtml}${cross}
              </div>
              <div class="role-desc">${r.description||""}</div>
              ${r.day_to_day?`<div class="role-extra"><b>A typical day:</b> ${r.day_to_day}</div>`:""}
              ${r.where_it_leads?`<div class="role-extra"><b>Where it leads:</b> ${r.where_it_leads}</div>`:""}
              ${r.needs?`<div class="role-extra"><b>What it takes:</b> ${r.needs}</div>`:""}
              ${r.reality?`<div class="role-real" style="margin-top:8px;"><b>Honest reality:</b> ${r.reality}</div>`:""}`;
            role.onclick=(e)=>{ e.stopPropagation(); toggleRole(id); };
            body.appendChild(role);
          });
          sec.appendChild(body);
        }
        fc.appendChild(sec);
      });
      updateBar();
      if(!window._exploreRendered){ window.scrollTo({top:0,behavior:"smooth"}); window._exploreRendered=true; }
    }

    function toggleRole(id){
      const y=window.scrollY;
      if(picks[currentKey][id]) delete picks[currentKey][id];
      else picks[currentKey][id]=true;
      saveAll(); renderWorld();
      window.scrollTo({top:y});
    }
    function worldCount(){ return Object.keys(picks[currentKey]||{}).length; }
    function updateBar(){
      const n=worldCount();
      document.getElementById("action-info").textContent=`${n} path${n===1?"":"s"} selected here`;
      document.getElementById("action-hint").textContent=n===0?"Tick the paths that pull at you.":`In ${world.short||world.name}.`;
      document.getElementById("done-btn").disabled=n===0;
    }

    function finishWorld(){
      if(worldCount()===0) return;
      saveAll(); buildClean();
      document.getElementById("explore").classList.add("hidden");
      document.getElementById("action-bar").classList.add("hidden");
      document.getElementById("decision").classList.remove("hidden");
      document.getElementById("nav-label").textContent="Nice work";
      document.getElementById("dec-badge").textContent=`✓ Explored ${world.short||world.name}`;
      const exploredCount=Object.keys(picks).filter(k=>Object.keys(picks[k]).length>0).length;
      const totalPaths=Object.values(picks).reduce((s,o)=>s+Object.keys(o).length,0);
      document.getElementById("dec-sub").textContent=`You've explored ${exploredCount} world${exploredCount===1?"":"s"} and chosen ${totalPaths} path${totalPaths===1?"":"s"} in total. Add another world, or move on to decide what to explore first?`;
      const dp=document.getElementById("dec-picks");
      dp.innerHTML=`<div class="dp-title">${world.name}</div>`;
      Object.keys(picks[currentKey]).forEach(id=>{
        const [family,role]=id.split("::");
        const label = role==="__ALL__" ? `${family} — whole area` : role;
        dp.innerHTML+=`<div class="dp-role">${label}</div>`;
      });
      window.scrollTo({top:0,behavior:"smooth"});
    }
    function addAnother(){ window.location.href="world.html"; }
    function continueOn(){ buildClean(); window.location.href="gather.html"; }

    function buildClean(){
      const clean=[];
      (DATA.industries||[]).forEach(ind=>{
        const p=picks[ind.key]; if(!p) return;
        Object.keys(p).forEach(id=>{
          const [family,role]=id.split("::");
          if(role==="__ALL__"){
            clean.push({industry:ind.name,industry_key:ind.key,family,role:`${family} (whole area)`,whole_family:true});
          } else {
            clean.push({industry:ind.name,industry_key:ind.key,family,role,whole_family:false});
          }
        });
      });
      userStore.set("explore_selections",JSON.stringify(clean));
    }
    function saveAll(){ userStore.set("explore_selections_raw",JSON.stringify(picks)); }

    init();
  </script>
</body>
</html>
