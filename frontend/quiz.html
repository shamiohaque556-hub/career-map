<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerMAP — Deep Diagnostic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #f4f5f7; --text: #111118; --text-muted: #646473; --gold: #b38b22; --border: #e2e4e9; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Loading ── */
    #loading-screen { text-align: center; padding-top: 140px; }
    .spinner { border: 3px solid var(--border); border-top-color: var(--gold); width: 40px; height: 40px; border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Standard Quiz Frame ── */
    .quiz-frame { max-width: 700px; margin: 72px auto; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 48px; box-shadow: 0 4px 24px rgba(0,0,0,0.03); }
    .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 44px; }
    .progress-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.4s ease; }
    .q-text { font-family: 'Playfair Display', serif; font-size: 25px; font-weight: 700; line-height: 1.45; margin-bottom: 36px; }

    /* ── Scale: text-label buttons ── */
    .scale-row { display: flex; gap: 8px; margin-bottom: 44px; }
    .scale-btn {
      flex: 1; padding: 14px 6px; border: 2px solid var(--border); border-radius: 8px;
      background: #fff; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700;
      color: var(--text-muted); cursor: pointer; transition: all 0.15s; text-align: center; line-height: 1.3;
    }
    .scale-btn:hover { border-color: var(--gold); color: var(--text); }
    .scale-btn.active { background: var(--text); color: #fff; border-color: var(--text); }

    .nav-row { display: flex; justify-content: space-between; align-items: center; }
    .btn { padding: 12px 28px; border-radius: 7px; font-weight: 700; cursor: pointer; border: none; font-size: 14px; font-family: 'DM Sans', sans-serif; }
    .btn-sec { background: none; color: var(--text-muted); }
    .btn-main { background: var(--text); color: #fff; transition: 0.15s; }
    .btn-main:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }
    .counter { font-size: 13px; font-weight: 700; color: var(--text-muted); }

    /* ── Qualitative Full-Screen Overlay ── */
    #qual-overlay {
      position: fixed; inset: 0; background: #0d0d10;
      display: flex; align-items: center; justify-content: center;
      z-index: 200; padding: 40px;
    }
    .qual-inner { max-width: 740px; width: 100%; }
    .qual-badge {
      display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: #c9a84c; background: rgba(201,168,76,0.12);
      border: 1px solid rgba(201,168,76,0.3); border-radius: 4px; padding: 5px 12px; margin-bottom: 28px;
    }
    .qual-title { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; color: #f5f4f0; line-height: 1.4; margin-bottom: 14px; }
    .qual-instruction { font-size: 14px; color: #7a7a8e; line-height: 1.7; margin-bottom: 32px; }
    .qual-textarea {
      width: 100%; min-height: 200px; background: #16161e; border: 1px solid #2c2c3a;
      border-radius: 10px; color: #f5f4f0; padding: 22px; font-family: 'DM Sans', sans-serif;
      font-size: 16px; line-height: 1.75; resize: none; transition: border-color 0.2s;
    }
    .qual-textarea:focus { outline: none; border-color: #c9a84c; }
    .qual-textarea::placeholder { color: #3e3e52; }
    .qual-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
    .wc-label { font-size: 13px; color: #7a7a8e; transition: color 0.2s; }
    .wc-label.met { color: #c9a84c; }
    .qual-btn {
      padding: 14px 34px; background: #f5f4f0; color: #0d0d10; border: none;
      border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: 0.2s;
    }
    .qual-btn:disabled { background: #2c2c3a; color: #4a4a5e; cursor: not-allowed; }
    .qual-btn:not(:disabled):hover { background: #c9a84c; color: #fff; }

    /* ── Done Screen ── */
    .done-frame {
      max-width: 640px; margin: 80px auto; background: #fff; border: 1px solid var(--border);
      border-radius: 14px; padding: 64px 52px; text-align: center;
    }
    .done-frame h1 { font-family: 'Playfair Display', serif; font-size: 30px; margin-bottom: 16px; }
    .done-frame p { color: var(--text-muted); line-height: 1.7; max-width: 460px; margin: 0 auto 40px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p style="font-family:'Playfair Display',serif; font-size:19px;" id="loading-text">Loading Diagnostic Modules...</p>
  </div>

  <!-- Qualitative Full-Screen -->
  <div id="qual-overlay" class="hidden">
    <div class="qual-inner">
      <div class="qual-badge" id="qual-badge">Signal 1 of 2</div>
      <h2 class="qual-title" id="qual-title"></h2>
      <p class="qual-instruction" id="qual-instruction"></p>
      <textarea class="qual-textarea" id="qual-textarea"
        placeholder="Write exactly what comes to mind. Unfiltered. The AI reads this to understand you, not to judge you."></textarea>
      <div class="qual-footer">
        <span class="wc-label" id="wc-label">0 / 30 words minimum</span>
        <button class="qual-btn" id="qual-btn" disabled onclick="commitQualitative()">Continue →</button>
      </div>
    </div>
  </div>

  <!-- Standard Quiz -->
  <div id="quiz-container" class="quiz-frame hidden">
    <div class="progress-bar"><div class="progress-fill" id="p-fill"></div></div>
    <div id="quiz-node"></div>
    <div class="nav-row">
      <button class="btn btn-sec" id="btn-back" onclick="goBack()">← Back</button>
      <span class="counter" id="counter">1 / 75</span>
      <button class="btn btn-main" id="btn-next" onclick="goNext()" disabled>Next →</button>
    </div>
  </div>

  <!-- Done Screen -->
  <div id="done-screen" class="done-frame hidden">
    <h1>Diagnostic Complete</h1>
    <p>Your 75 responses are saved. Before your analysis is generated, we ask four deep questions. Your answers to these shape the accuracy of everything that follows — be honest.</p>
    <button class="btn btn-main" style="padding:16px 44px; font-size:16px;" onclick="proceedToBlueprint()">
      Continue to Foundation Questions →
    </button>
  </div>

  <script src="config.js"></script>
  <script src="userstore.js"></script>
  <script>
    const BACKEND_URL = Config.BACKEND_URL;

    const SCALE = ["Never", "Rarely", "Sometimes", "Often", "Always"];

    const QUAL_PROMPTS = [
      {
        key: "monday_context",
        badge: "Qualitative Signal — 1 of 2",
        title: "Write what a perfect, unrestricted Monday morning looks like for you.",
        instruction: "No obligations. No one watching. What are you doing, where are you, who is there — or isn't? Be specific: name the actual activity, not just the feeling it gives you."
      },
      {
        key: "unfinished_context",
        badge: "Qualitative Signal — 2 of 2",
        title: "Name one complex project or goal you started but never finished — and explain why.",
        instruction: "It doesn't need to be work-related. What exactly happened at the moment you stopped? Name the specific reason, not the polished version of it."
      }
    ];

    let questions = [];
    let idx = 0;
    let sessionId = null;
    let answersMap = {};
    let qualAnswers = {};
    let activeQualIdx = null;
    const token = localStorage.getItem("token");

    async function init() {
      if (!token) { window.location.href = "index.html"; return; }
      try {
        const sRes = await apiFetch("/quiz/session/start", "POST");
        sessionId = sRes.session_id;

        questions = await apiFetch("/quiz/questions", "GET");

        if (sRes.resume && sRes.answered_count > 0) {
          answersMap = await apiFetch(`/quiz/session/${sessionId}/answers-map`, "GET");
          idx = Math.min(Object.keys(answersMap).length, questions.length);
        }

        hide("loading-screen");
        if (idx >= questions.length) showDone();
        else { show("quiz-container"); render(); }

      } catch (e) {
        document.getElementById("loading-text").textContent = "Connection error. Ensure the backend is running.";
        document.getElementById("loading-text").style.color = "#b54747";
      }
    }

    function render() {
      // Check if we need a qualitative pause
      if (idx === 25 && !qualAnswers.monday_context) { openQual(0); return; }
      if (idx === 50 && !qualAnswers.unfinished_context) { openQual(1); return; }

      const q = questions[idx];
      const node = document.getElementById("quiz-node");
      node.innerHTML = "";

      // Progress
      document.getElementById("p-fill").style.width = `${(idx / questions.length) * 100}%`;
      document.getElementById("counter").textContent = `${idx + 1} / ${questions.length}`;
      document.getElementById("btn-back").style.visibility = idx === 0 ? "hidden" : "visible";

      const selected = answersMap[q.id] || null;

      // Question text
      const qEl = document.createElement("div");
      qEl.className = "q-text";
      qEl.textContent = q.text;
      node.appendChild(qEl);

      // Scale buttons
      const scaleRow = document.createElement("div");
      scaleRow.className = "scale-row";
      SCALE.forEach((label, i) => {
        const rating = i + 1;
        const btn = document.createElement("button");
        btn.className = `scale-btn${selected === rating ? " active" : ""}`;
        btn.textContent = label;
        btn.onclick = () => pickRating(q.id, rating);
        scaleRow.appendChild(btn);
      });
      node.appendChild(scaleRow);

      const nextBtn = document.getElementById("btn-next");
      nextBtn.disabled = selected === null;
      nextBtn.textContent = idx === questions.length - 1 ? "Finish" : "Next →";
    }

    function openQual(qualIdx) {
      activeQualIdx = qualIdx;
      const p = QUAL_PROMPTS[qualIdx];
      document.getElementById("qual-badge").textContent = p.badge;
      document.getElementById("qual-title").textContent = p.title;
      document.getElementById("qual-instruction").textContent = p.instruction;
      document.getElementById("qual-textarea").value = qualAnswers[p.key] || "";
      hide("quiz-container");
      show("qual-overlay");
      document.getElementById("qual-textarea").focus();
      updateWC();
    }

    function updateWC() {
      const text = document.getElementById("qual-textarea").value.trim();
      const count = text ? text.split(/\s+/).filter(w => w.length > 0).length : 0;
      const MIN = 30;
      const lbl = document.getElementById("wc-label");
      lbl.textContent = count < MIN ? `${count} / ${MIN} words minimum` : `${count} words ✓`;
      lbl.className = count >= MIN ? "wc-label met" : "wc-label";
      document.getElementById("qual-btn").disabled = count < MIN;
    }

    document.getElementById("qual-textarea").addEventListener("input", updateWC);

    function commitQualitative() {
      const p = QUAL_PROMPTS[activeQualIdx];
      qualAnswers[p.key] = document.getElementById("qual-textarea").value.trim();
      apiFetch(`/quiz/session/${sessionId}/qualitative`, "POST", qualAnswers);
      hide("qual-overlay");
      show("quiz-container");
      render();
    }

    async function pickRating(qId, rating) {
      answersMap[qId] = rating;
      document.querySelectorAll(".scale-btn").forEach((b, i) => {
        b.classList.toggle("active", i + 1 === rating);
      });
      document.getElementById("btn-next").disabled = false;
      await apiFetch(`/quiz/session/${sessionId}/answer`, "POST", { question_id: qId, rating });
    }

    function goNext() {
      if (idx < questions.length - 1) { idx++; render(); }
      else showDone();
    }

    function goBack() {
      if (idx === 0) return;
      // Clear qualitative gates when going back past them
      if (idx === 25) delete qualAnswers.monday_context;
      if (idx === 50) delete qualAnswers.unfinished_context;
      idx--;
      render();
    }

    function showDone() {
      hide("quiz-container");
      show("done-screen");
    }

    async function proceedToBlueprint() {
      const btn = document.querySelector("#done-screen .btn-main");
      btn.textContent = "Saving...";
      btn.disabled = true;
      try {
        await apiFetch(`/quiz/session/${sessionId}/complete`, "POST");
        userStore.set("active_session_id", sessionId);
        window.location.href = "blueprint.html";
      } catch {
        btn.textContent = "Continue to Foundation Questions →";
        btn.disabled = false;
        alert("Save failed. Please try again.");
      }
    }

    // ── Helpers ──────────────────────────────────────────────────────────────
    async function apiFetch(path, method, body) {
      const opts = { method, headers: { "Authorization": `Bearer ${token}` } };
      if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
      const res = await fetch(`${BACKEND_URL}${path}`, opts);
      if (method === "GET" || res.headers.get("content-type")?.includes("json")) return res.json();
    }
    function show(id) { document.getElementById(id).classList.remove("hidden"); }
    function hide(id) { document.getElementById(id).classList.add("hidden"); }

    init();
  </script>
</body>
</html>
