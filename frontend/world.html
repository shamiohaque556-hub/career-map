<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerMAP — Choose Your World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#0f0e14;--bg2:#16151f;--surface:#1c1b27;--surface2:#23222f;
      --text:#f4f2ec;--muted:#9b98ac;--faint:#65627a;
      --gold:#d4a93f;--gold-soft:rgba(212,169,63,.12);--border:rgba(255,255,255,.07);
      --green:#5dd39e;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
    body::before{content:"";position:fixed;inset:0;background:
      radial-gradient(ellipse 80% 50% at 20% -10%,rgba(212,169,63,.10),transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 10%,rgba(93,211,158,.06),transparent 55%);
      pointer-events:none;z-index:0;}

    .nav{position:relative;z-index:5;padding:22px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);backdrop-filter:blur(8px);}
    .brand{font-family:'Fraunces',serif;font-size:21px;font-weight:900;letter-spacing:-.01em;}
    .brand span{color:var(--gold);}
    .nav-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;}

    .container{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:70px 28px 120px;}
    .hidden{display:none!important;}

    .hero{text-align:center;margin-bottom:18px;}
    .kicker{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:20px;}
    .hero h1{font-family:'Fraunces',serif;font-size:clamp(38px,6vw,68px);font-weight:900;line-height:1.02;letter-spacing:-.02em;margin-bottom:22px;}
    .hero h1 em{font-style:italic;font-weight:500;color:var(--gold);}
    .hero p{font-size:16px;line-height:1.7;color:var(--muted);max-width:560px;margin:0 auto;}

    /* explored progress */
    .explored{max-width:760px;margin:34px auto 0;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;}
    .explored-left{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .done-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(93,211,158,.1);color:var(--green);border:1px solid rgba(93,211,158,.25);border-radius:30px;padding:5px 13px;font-size:12.5px;font-weight:600;}
    .btn-done{background:var(--gold);color:#1a1305;border:none;border-radius:30px;padding:12px 22px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:.2s;}
    .btn-done:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(212,169,63,.3);}

    /* recommendation */
    .recommend{position:relative;max-width:920px;margin:46px auto 0;border-radius:22px;padding:1px;background:linear-gradient(135deg,var(--gold),rgba(212,169,63,.2),transparent);overflow:hidden;}
    .recommend-inner{background:linear-gradient(160deg,var(--surface2),var(--surface));border-radius:21px;padding:32px 34px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;}
    .rec-glyph{font-size:46px;line-height:1;filter:drop-shadow(0 4px 14px rgba(0,0,0,.4));}
    .rec-body{flex:1;min-width:240px;}
    .rec-tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);border:1px solid rgba(212,169,63,.3);border-radius:5px;padding:5px 12px;margin-bottom:12px;}
    .rec-sector{font-family:'Fraunces',serif;font-size:27px;font-weight:600;margin-bottom:5px;}
    .rec-role{font-size:13.5px;color:var(--muted);margin-bottom:12px;}
    .rec-reason{font-size:13.5px;line-height:1.6;color:var(--muted);}

    .section-head{display:flex;align-items:baseline;justify-content:space-between;max-width:1180px;margin:64px auto 26px;gap:16px;flex-wrap:wrap;}
    .section-head h2{font-family:'Fraunces',serif;font-size:25px;font-weight:600;}
    .section-head span{font-size:13.5px;color:var(--faint);}

    /* THE GRID OF WORLDS */
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
    @media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr);}}
    @media(max-width:680px){.grid{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:440px){.grid{grid-template-columns:1fr;}}

    .world{position:relative;border-radius:20px;padding:24px 22px 22px;cursor:pointer;overflow:hidden;min-height:172px;display:flex;flex-direction:column;justify-content:space-between;
      background:var(--surface);border:1px solid var(--border);
      opacity:0;transform:translateY(16px);animation:rise .6s cubic-bezier(.2,.7,.3,1) forwards;
      transition:transform .25s cubic-bezier(.2,.7,.3,1),box-shadow .25s,border-color .25s;}
    @keyframes rise{to{opacity:1;transform:translateY(0);}}
    .world::before{content:"";position:absolute;inset:0;opacity:.16;background:radial-gradient(circle at 78% 18%,var(--accent),transparent 62%);transition:opacity .25s;}
    .world::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.85;}
    .world:hover{transform:translateY(-5px);box-shadow:0 18px 44px rgba(0,0,0,.45);border-color:var(--accent);}
    .world:hover::before{opacity:.32;}
    .w-glyph{font-size:34px;line-height:1;filter:drop-shadow(0 3px 10px rgba(0,0,0,.5));position:relative;z-index:1;}
    .w-body{position:relative;z-index:1;}
    .w-name{font-family:'Fraunces',serif;font-size:18px;font-weight:600;line-height:1.18;margin-bottom:5px;}
    .w-short{font-size:12px;color:var(--muted);line-height:1.4;}
    .w-rec{position:absolute;top:14px;right:14px;z-index:2;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#1a1305;padding:4px 9px;border-radius:30px;}

    /* explored/done state */
    .world.done{cursor:pointer;}
    .world.done .w-glyph,.world.done .w-name,.world.done .w-short{opacity:.4;}
    .world.done::after{background:var(--green);}
    .w-check{position:absolute;top:13px;right:13px;z-index:2;width:26px;height:26px;border-radius:50%;background:var(--green);color:#08130d;display:none;align-items:center;justify-content:center;font-size:14px;font-weight:800;}
    .world.done .w-check{display:flex;}
    .w-revisit{position:absolute;left:22px;bottom:14px;z-index:2;font-size:10px;color:var(--green);font-weight:600;letter-spacing:.02em;}

    .loading{position:relative;z-index:2;text-align:center;padding:140px 24px;color:var(--muted);}
    .spinner{width:42px;height:42px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 22px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .errbox{max-width:600px;margin:0 auto;text-align:left;background:rgba(181,71,71,.08);border:1px solid rgba(181,71,71,.3);border-radius:14px;padding:24px;color:#e8a0a0;line-height:1.6;font-size:14px;}
    .errbox code{background:rgba(0,0,0,.3);padding:2px 7px;border-radius:5px;}
  </style>
</head>
<body>
  <div class="nav">
    <div class="brand">Career<span>MAP</span></div>
    <div style="display:flex;align-items:center;gap:14px;"><a href="profile.html" style="text-decoration:none;color:#d4a93f;font-size:13px;font-weight:600;border:1px solid rgba(212,169,63,.4);padding:7px 14px;border-radius:20px;white-space:nowrap;">↩ Dashboard</a><div class="nav-label">Career Atlas</div></div>
  </div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p style="font-family:'Fraunces',serif;font-size:19px;">Mapping your landscape&hellip;</p>
  </div>

  <div id="main" class="container hidden">
    <div class="hero">
      <div class="kicker">Choose a World to Explore</div>
      <h1>Where does your <em>curiosity</em> pull you?</h1>
      <p>Step into one world at a time. Explore it in depth, mark what speaks to you — then add another, or move on. Tap any world to begin.</p>
    </div>

    <div class="explored hidden" id="explored"></div>

    <div class="recommend hidden" id="recommend">
      <div class="recommend-inner">
        <div class="rec-glyph" id="rec-glyph">✦</div>
        <div class="rec-body">
          <span class="rec-tag">Recommended for you</span>
          <div class="rec-sector" id="rec-sector">—</div>
          <div class="rec-role" id="rec-role"></div>
          <div class="rec-reason" id="rec-reason"></div>
        </div>
      </div>
    </div>

    <div class="section-head">
      <h2>All Worlds</h2>
      <span id="world-count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="error" class="loading hidden"></div>

  <script src="config.js"></script>
  <script src="userstore.js"></script>
  <script>
    const token = localStorage.getItem("token");
    if(!token) window.location.href="index.html";
    const CONTENT_URL="industries.json";

    // a distinct accent color per industry key (modern identity)
    const ACCENTS={
      tech:"#5b8def", manufacturing:"#e2843b", engineering:"#7c6cf0", trades:"#c98a3a",
      finance:"#3fae7a", entrepreneurship:"#e0653f", healthcare:"#e0607d", academics:"#5aa0d6",
      creative:"#d265c2", government:"#6d7fc4", agriculture:"#8aab3e", sustainability:"#4cb588",
      retail:"#e09a3c", hospitality:"#d6735a", athletics:"#4aa3c4", business:"#b98ad6"
    };
    const FALLBACK="#d4a93f";

    let allIndustries=[], recommendedKey=null, recommendedRole=null, exploredKeys=[];

    async function init(){
      try{
        const res=await fetch(CONTENT_URL);
        if(!res.ok) throw new Error("HTTP "+res.status);
        const data=await res.json();
        allIndustries=(data.industries||[]).filter(i=>i.enabled!==false);
      }catch(err){
        document.getElementById("loading").classList.add("hidden");
        const e=document.getElementById("error"); e.classList.remove("hidden");
        e.innerHTML=`<div class="errbox"><strong>Couldn't load industries.json.</strong><br><br>
          Make sure <code>industries.json</code> sits in the same folder and you're using Live Server.<br><br>
          <span style="opacity:.7;">(${err.message})</span></div>`;
        return;
      }
      await tryRecommend();
      const raw=JSON.parse(userStore.get("explore_selections_raw")||"{}");
      exploredKeys=Object.keys(raw).filter(k=>raw[k]&&Object.keys(raw[k]).length>0);

      document.getElementById("loading").classList.add("hidden");
      document.getElementById("main").classList.remove("hidden");
      document.getElementById("world-count").textContent=`${allIndustries.length} worlds`;
      renderExplored(); renderGrid();
    }

    async function tryRecommend(){
      try{
        const res=await fetch(`${Config.BACKEND_URL}/quiz/world-map`,{headers:{"Authorization":`Bearer ${token}`}});
        if(!res.ok) throw new Error();
        const data=await res.json();
        const primary=(data.top_matches&&data.top_matches[0])||null;
        const recName=primary?primary.sector:null;
        recommendedRole=primary?primary.role:null;
        if(recName){
          const m=allIndustries.find(i=>i.name===recName||recName.toLowerCase().includes((i.short||"").toLowerCase())||(i.name&&recName.toLowerCase().includes(i.name.toLowerCase().split(",")[0])));
          recommendedKey=m?m.key:null;
          document.getElementById("rec-sector").textContent=m?m.name:recName;
          if(m){document.getElementById("rec-glyph").textContent=m.icon||"✦";}
        }
        document.getElementById("rec-role").textContent=recommendedRole?`Closest role: ${recommendedRole}`:"";
        document.getElementById("rec-reason").textContent=data.algorithmic_reasoning||"";
        document.getElementById("recommend").classList.remove("hidden");
      }catch{ /* quiz not done — hide rec */ }
    }

    function renderExplored(){
      const box=document.getElementById("explored");
      if(exploredKeys.length===0){box.classList.add("hidden");return;}
      const raw=JSON.parse(userStore.get("explore_selections_raw")||"{}");
      const chips=exploredKeys.map(k=>{
        const ind=allIndustries.find(i=>i.key===k);
        const n=raw[k]?Object.keys(raw[k]).length:0;
        return `<span class="done-chip">✓ ${ind?ind.short:k} · ${n}</span>`;
      }).join("");
      box.innerHTML=`<div class="explored-left"><span>Explored so far:</span>${chips}</div>
        <a class="btn-done" href="gather.html">Choose what to explore first →</a>`;
      box.classList.remove("hidden");
    }

    function renderGrid(){
      const grid=document.getElementById("grid"); grid.innerHTML="";
      allIndustries.forEach((ind,i)=>{
        const done=exploredKeys.includes(ind.key);
        const isRec=ind.key===recommendedKey&&!done;
        const accent=ACCENTS[ind.key]||FALLBACK;
        const el=document.createElement("div");
        el.className=`world${done?" done":""}`;
        el.style.setProperty("--accent",accent);
        el.style.animationDelay=`${i*0.045}s`;
        el.addEventListener("click",()=>explore(ind.key));
        el.innerHTML=`
          ${isRec?'<div class="w-rec">★ For you</div>':''}
          <div class="w-check">✓</div>
          <div class="w-glyph">${ind.icon||"🧭"}</div>
          <div class="w-body">
            <div class="w-name">${ind.short||ind.name}</div>
            <div class="w-short">${done?"":(shortLine(ind))}</div>
          </div>
          ${done?'<div class="w-revisit">explored — tap to revisit</div>':''}`;
        grid.appendChild(el);
      });
    }
    function shortLine(ind){
      // a tiny teaser: first few words of intro, or family count
      if(ind.intro){const t=ind.intro.trim();return t.length>52?t.slice(0,52).trim()+"…":t;}
      return (ind.families?ind.families.length:0)+" areas to explore";
    }

    function explore(key){
      userStore.set("explore_current",key);
      window.location.href="world-explore.html";
    }

    init();
  </script>
</body>
</html>
