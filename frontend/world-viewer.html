<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerMAP — World Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#f4f5f7; --card:#ffffff; --text:#111118; --muted:#646473;
      --gold:#b38b22; --gold-soft:rgba(179,139,34,0.08); --gold-glow:rgba(179,139,34,0.15);
      --border:#e2e4e9; --red:#b54747; --red-bg:#fff5f5; --ink:#1a1a22; --tile:#16161e;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px;}
    .nav{padding:22px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:30;}
    .brand{font-family:'Playfair Display',serif;font-size:19px;font-weight:900;}
    .nav-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;}
    .container{max-width:920px;margin:0 auto;padding:48px 24px 0;}

    /* loader / error */
    .status{text-align:center;padding:100px 24px;color:var(--muted);}
    .status .spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 18px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .errbox{max-width:620px;margin:0 auto;text-align:left;background:var(--red-bg);border:1px solid #fbd5d5;border-radius:10px;padding:22px 24px;color:#7a2020;line-height:1.6;font-size:14px;}
    .errbox code{background:#fff;padding:1px 6px;border-radius:4px;border:1px solid #f0c0c0;}

    /* grid of world tiles */
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
    @media (max-width:820px){.grid{grid-template-columns:repeat(3,1fr);}}
    @media (max-width:540px){.grid{grid-template-columns:repeat(2,1fr);}}
    .tile{position:relative;border-radius:16px;padding:24px 14px;background:var(--tile);border:1px solid #2a2a38;cursor:pointer;text-align:center;transition:transform .15s,box-shadow .15s,border-color .15s;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
    .tile:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.16);border-color:#3a3a4e;}
    .tile-icon{font-size:28px;}
    .tile-name{font-size:13.5px;font-weight:700;color:#f5f4f0;}
    .tile-count{font-size:11px;color:#9a9ab0;}

    .page-title{font-family:'Playfair Display',serif;font-size:34px;font-weight:900;text-align:center;margin-bottom:8px;}
    .page-sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:40px;}

    /* world detail */
    .back{background:none;border:1px solid var(--border);border-radius:8px;padding:9px 18px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:28px;color:var(--text);}
    .back:hover{border-color:var(--text);}
    .step-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:var(--muted);margin-bottom:12px;}
    .sector-name{font-family:'Playfair Display',serif;font-size:42px;font-weight:900;line-height:1.1;margin-bottom:14px;}
    .sector-intro{font-size:15.5px;color:var(--muted);line-height:1.65;max-width:700px;margin-bottom:0;}

    .family{margin-top:48px;}
    .family-title{font-family:'Playfair Display',serif;font-size:23px;font-weight:700;margin-bottom:5px;}
    .family-blurb{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:20px;max-width:720px;}
    .role{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:12px;}
    .role-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
    .role-name{font-size:17px;font-weight:700;}
    .role-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;padding:3px 9px;border-radius:5px;white-space:nowrap;background:var(--gold-soft);color:var(--gold);}
    .role-cross{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;padding:3px 9px;border-radius:5px;white-space:nowrap;background:rgba(37,99,235,.09);color:#2563eb;margin-left:6px;}
    .role-what{font-size:14px;line-height:1.6;margin-bottom:8px;}
    .role-real{font-size:12.5px;line-height:1.55;color:var(--red);background:var(--red-bg);border:1px solid #fbd5d5;border-radius:7px;padding:9px 12px;}
    .role-real strong{font-style:normal;}

    .callout{margin-top:52px;background:var(--ink);color:#f5f4f0;border-radius:14px;padding:30px;}
    .callout h3{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:10px;color:#fff;}
    .callout p{font-size:14px;line-height:1.7;color:#c9c9d4;}
    .notseen{margin-top:24px;border:1px dashed var(--border);border-radius:12px;padding:22px 24px;background:#fafafb;}
    .notseen h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:10px;}
    .notseen p{font-size:14px;line-height:1.7;color:var(--muted);}
    .hidden{display:none!important;}
  </style>
</head>
<body>
  <div class="nav">
    <div class="brand">CareerMAP</div>
    <div class="nav-label">World Viewer</div>
  </div>

  <div id="status" class="status">
    <div class="spinner"></div>
    <p style="font-family:'Playfair Display',serif;font-size:17px;">Loading worlds…</p>
  </div>

  <!-- Grid view -->
  <div id="grid-view" class="container hidden">
    <h1 class="page-title">All Worlds</h1>
    <p class="page-sub">Tap any world to see everything inside it.</p>
    <div class="grid" id="tiles"></div>
  </div>

  <!-- Detail view -->
  <div id="detail-view" class="container hidden">
    <button class="back" onclick="showGrid()">← All Worlds</button>
    <div class="step-label">The World Of</div>
    <h1 class="sector-name" id="d-name"></h1>
    <p class="sector-intro" id="d-intro"></p>
    <div id="d-families"></div>
    <div class="callout"><h3>The one thing to take</h3><p id="d-onething"></p></div>
    <div class="notseen"><h4>What this world will not give you</h4><p id="d-wontgive"></p></div>
  </div>

  <script>
    let DATA = null;

    async function load() {
      try {
        const res = await fetch('industries.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        DATA = await res.json();
        document.getElementById('status').classList.add('hidden');
        renderGrid();
      } catch (err) {
        document.getElementById('status').innerHTML = `
          <div class="errbox">
            <strong>Couldn't load industries.json.</strong><br><br>
            This almost always means the file is being opened directly from disk (file://), which browsers block for security.<br><br>
            <strong>The fix:</strong> run a tiny local server from the folder that contains both <code>world-viewer.html</code> and <code>industries.json</code>:<br><br>
            <code>python -m http.server 8000</code><br><br>
            Then open <code>http://localhost:8000/world-viewer.html</code> in your browser.<br><br>
            <span style="color:#555;">(Technical detail: ${err.message})</span>
          </div>`;
      }
    }

    function renderGrid() {
      const tiles = document.getElementById('tiles');
      tiles.innerHTML = '';
      DATA.industries.filter(i => i.enabled !== false).forEach(ind => {
        const roleCount = ind.families.reduce((n,f)=>n + f.roles.filter(r=>r.enabled!==false).length, 0);
        const t = document.createElement('div');
        t.className = 'tile';
        t.onclick = () => showDetail(ind.key);
        t.innerHTML = `<div class="tile-icon">${ind.icon||'🧭'}</div>
                       <div class="tile-name">${ind.short||ind.name}</div>
                       <div class="tile-count">${roleCount} roles</div>`;
        tiles.appendChild(t);
      });
      document.getElementById('grid-view').classList.remove('hidden');
    }

    function showDetail(key) {
      const ind = DATA.industries.find(i => i.key === key);
      if (!ind) return;
      document.getElementById('d-name').textContent = ind.name;
      document.getElementById('d-intro').textContent = ind.intro || '';
      document.getElementById('d-onething').textContent = ind.one_thing || '';
      document.getElementById('d-wontgive').textContent = ind.wont_give || '';

      const fams = document.getElementById('d-families');
      fams.innerHTML = '';
      ind.families.forEach(fam => {
        const enabledRoles = fam.roles.filter(r => r.enabled !== false);
        if (enabledRoles.length === 0) return;
        const block = document.createElement('div');
        block.className = 'family';
        let html = `<div class="family-title">${fam.name}</div>`;
        if (fam.blurb) html += `<div class="family-blurb">${fam.blurb}</div>`;
        enabledRoles.forEach(r => {
          const cross = r.cross_link ? `<span class="role-cross">→ ${r.cross_link}</span>` : '';
          html += `
            <div class="role">
              <div class="role-top">
                <span class="role-name">${r.name}</span>
                <span>${r.tag ? `<span class="role-tag">${r.tag}</span>` : ''}${cross}</span>
              </div>
              <div class="role-what">${r.description||''}</div>
              ${r.reality ? `<div class="role-real"><strong>Honest reality:</strong> ${r.reality}</div>` : ''}
            </div>`;
        });
        block.innerHTML = html;
        fams.appendChild(block);
      });

      document.getElementById('grid-view').classList.add('hidden');
      document.getElementById('detail-view').classList.remove('hidden');
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function showGrid() {
      document.getElementById('detail-view').classList.add('hidden');
      document.getElementById('grid-view').classList.remove('hidden');
      window.scrollTo({top:0,behavior:'smooth'});
    }

    load();
  </script>
</body>
</html>
